# Render Blueprint — https://render.com/docs/blueprint-spec
# Vibe-Lock now needs a server (to proxy Gemini and keep the API key secret), so
# it runs as a Node Web Service that serves the built frontend AND the /api routes
# from one origin.
services:
  - type: web
    name: vibe-lock
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Secret — do NOT put the value here. Set it in the Render dashboard
      # (Environment tab). `sync: false` tells Render to prompt for it.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: NODE_VERSION
        value: "22"
