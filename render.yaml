# Render Blueprint — https://render.com/docs/blueprint-spec
# Vibe-Lock is a fully client-side Vite SPA, so it deploys as a free Static Site.
services:
  - type: web
    name: vibe-lock
    runtime: static
    # npm ci installs devDependencies (vite, typescript) which the build needs.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Build previews for every PR opened against the repo.
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "22"
    # No SPA rewrite: this is a single page with no client-side routes, so a
    # catch-all `/* -> /index.html` rewrite only risks intercepting requests for
    # /assets/*.js and serving HTML back (wrong MIME type -> blank page). Render
    # serves index.html at / and the hashed assets directly, which is all we need.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
